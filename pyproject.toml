[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polyrea"
version = "0.1.0"
description = "Polymarket wallet strategy reverse engineering (REA-style evidence MCP + CLI)"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "mcp>=1.2",  # 1.x FastMCP or 2.x MCPServer
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "pyarrow>=14",
]

[project.optional-dependencies]
test = ["pytest>=8", "hypothesis>=6"]
research = ["scikit-learn>=1.5", "lightgbm>=4.3", "statsmodels>=0.14", "websockets>=13"]

[project.scripts]
polyrea = "polyrea.cli:main"
polyrea-mcp = "polyrea.server:main"

[tool.setuptools.packages.find]
include = ["polyrea*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits public Polymarket/Polygon endpoints (deselect with -m 'not live')"]
addopts = "-m 'not live'"
